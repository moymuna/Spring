<div class="contact-grid">
  <div class="contact-info">
    <div class="info-item">
      <div class="info-icon"><i class="bi bi-envelope-fill"></i></div>
      <div>
        <h4>Email</h4>
        <p>support&#64;hrmsystem.com</p>
      </div>
    </div>
    <div class="info-item">
      <div class="info-icon"><i class="bi bi-telephone-fill"></i></div>
      <div>
        <h4>Phone</h4>
        <p>+880 1XXX-XXXXXX</p>
      </div>
    </div>
    <div class="info-item">
      <div class="info-icon"><i class="bi bi-geo-alt-fill"></i></div>
      <div>
        <h4>Address</h4>
        <p>House 12, Road 5, Gulshan-1<br />Dhaka-1212, Bangladesh</p>
      </div>
    </div>
    <div class="info-item">
      <div class="info-icon"><i class="bi bi-clock-fill"></i></div>
      <div>
        <h4>Hours</h4>
        <p>Sun – Thu, 9:00 AM – 6:00 PM</p>
      </div>
    </div>
  </div>
  <form class="contact-form" #contactForm="ngForm" (ngSubmit)="submit(contactForm)" novalidate>
    <div class="form-row">
      <label for="name">Full Name</label>
      <input
        id="name"
        name="name"
        type="text"
        [(ngModel)]="dto.name"
        #name="ngModel"
        required
        minlength="2"
        placeholder="Enter your Name"
        [class.invalid]="name.invalid && name.touched"
      />
      <span class="field-error" *ngIf="name.invalid && name.touched">Please enter your name.</span>
    </div>
    <div class="form-row">
      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="dto.email"
        #email="ngModel"
        required
        email
        placeholder="Enter Email"
        [class.invalid]="email.invalid && email.touched"
      />
      <span class="field-error" *ngIf="email.invalid && email.touched"
        >Please enter a valid email address.</span
      >
    </div>
    <div class="form-row">
      <label for="subject">Subject</label>
      <input
        id="subject"
        name="subject"
        type="text"
        [(ngModel)]="dto.subject"
        #subject="ngModel"
        required
        placeholder="Enter Subject"
        [class.invalid]="subject.invalid && subject.touched"
      />
      <span class="field-error" *ngIf="subject.invalid && subject.touched"
        >Please enter a subject.</span
      >
    </div>
    <div class="form-row">
      <label for="message">Message</label>
      <textarea
        id="message"
        name="message"
        rows="5"
        [(ngModel)]="dto.message"
        #message="ngModel"
        required
        minlength="10"
        placeholder="Enter Message"
        [class.invalid]="message.invalid && message.touched"
      ></textarea>
      <span class="field-error" *ngIf="message.invalid && message.touched"
        >Message should be at least 10 characters.</span
      >
    </div>
    <button type="submit" class="submit-btn" [disabled]="submitting">
      <span *ngIf="!submitting">Send Message</span>
      <span *ngIf="submitting">Sending...</span>
    </button>
  </form>
</div>
