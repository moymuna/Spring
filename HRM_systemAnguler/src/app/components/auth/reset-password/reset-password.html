<div class="reset-container">
  <div class="reset-card">
    <h2>Reset Password</h2>
    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
    <div class="success-message" *ngIf="success">
      Password reset successfully. Redirecting to login...
    </div>
    <form *ngIf="!success" (ngSubmit)="submit()">
      <div class="form-group">
        <label> New Password </label>
        <div class="password-box">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="newPassword"
            name="newPassword"
            placeholder="Enter New Password"
            required
          />
          <button
            type="button"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            (click)="showPassword = !showPassword"
          >
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label> Confirm Password </label>
        <div class="password-box">
          <input
            [type]="showConfirm ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm Password"
            required
          />
          <button
            type="button"
            [attr.aria-label]="showConfirm ? 'Hide password' : 'Show password'"
            (click)="showConfirm = !showConfirm"
          >
            <i class="bi" [ngClass]="showConfirm ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
          </button>
        </div>
        <small class="match-error" *ngIf="mismatch"> Password does not match. </small>
      </div>
      <button class="reset-btn" type="submit" [disabled]="loading || mismatch">
        <span *ngIf="!loading"> Reset Password </span>
        <span *ngIf="loading"> Resetting... </span>
      </button>
    </form>
  </div>
</div>
