<div class="register-page">
  <div class="register-container">
    <div class="register-card">
      <h2>Sign Up as Applicant</h2>
      <div class="success-message" *ngIf="successMessage">
        <i class="bi bi-check-circle-fill me-2"></i>{{ successMessage }}
      </div>
      <div class="error-message" *ngIf="errorMessage">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
      </div>
      <form (ngSubmit)="register()" #registerForm="ngForm">
        <h3 class="section-title">Account Details</h3>
        <div class="form-group">
          <label><i class="bi bi-person-fill me-1"></i> Full Name</label>
          <input
            type="text"
            name="name"
            [(ngModel)]="dto.name"
            placeholder="Enter your Name"
            required
          />
        </div>
        <div class="form-group">
          <label><i class="bi bi-envelope-fill me-1"></i> Email Address</label>
          <input
            type="email"
            name="email"
            [(ngModel)]="dto.email"
            placeholder="Enter Email"
            required
          />
        </div>
        <div class="form-group">
          <label><i class="bi bi-telephone-fill me-1"></i> Phone Number</label>
          <input
            type="tel"
            name="phone"
            [(ngModel)]="dto.phone"
            placeholder="Enter Phone Number"
            required
          />
        </div>
        <div class="form-group">
          <label><i class="bi bi-geo-alt-fill me-1"></i> Address</label>
          <input
            type="text"
            name="address"
            [(ngModel)]="dto.address"
            placeholder="Enter Address"
            required
          />
        </div>
        <div class="form-group">
          <label><i class="bi bi-lock-fill me-1"></i> Password</label>
          <input
            type="password"
            name="password"
            [(ngModel)]="dto.password"
            placeholder="Enter Password"
            minlength="8"
            required
          />
        </div>
        <div class="form-group">
          <label><i class="bi bi-lock-fill me-1"></i> Confirm Password</label>
          <input
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm Password"
            required
          />
          <span class="field-error" *ngIf="confirmPassword && confirmPassword !== dto.password">
            Passwords do not match.
          </span>
        </div>
        <h3 class="section-title">Profile</h3>
        <div class="form-group">
          <label><i class="bi bi-mortarboard-fill me-1"></i> Education</label>
          <div class="checkbox-grid">
            <label class="checkbox-item" *ngFor="let level of educationOptions">
              <input
                type="checkbox"
                [checked]="dto.education.includes(level)"
                (change)="toggleEducation(level, $any($event.target).checked)"
              />
              {{ level }}
            </label>
          </div>
        </div>
        <div class="form-group">
          <label><i class="bi bi-briefcase-fill me-1"></i> Experience Level</label>
          <div class="checkbox-grid">
            <label class="checkbox-item" *ngFor="let level of experienceOptions">
              <input
                type="checkbox"
                [checked]="dto.experience.includes(level)"
                (change)="toggleExperience(level, $any($event.target).checked)"
              />
              {{ level }}
            </label>
          </div>
        </div>
        <div class="form-group">
          <label><i class="bi bi-stars me-1"></i> Skills</label>
          <textarea
            name="skills"
            rows="3"
            [(ngModel)]="dto.skills"
            placeholder="Enter Skills"
          ></textarea>
        </div>
        <button
          type="submit"
          class="register-btn"
          [disabled]="loading || registerForm.invalid || confirmPassword !== dto.password"
        >
          <span *ngIf="!loading">Register</span>
          <span *ngIf="loading">Creating Account...</span>
        </button>
        <div class="auth-links text-center mt-3">
          Already have an account? <a routerLink="/login">Login here</a>
        </div>
      </form>
    </div>
  </div>
</div>
