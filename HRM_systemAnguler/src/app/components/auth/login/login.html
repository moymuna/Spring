<div class="login-page">
  <app-public-header></app-public-header>
  <div class="login-container">
    <div class="login-card">
      <h2>Login</h2>
      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
      <form (ngSubmit)="login()">
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            name="email"
            [(ngModel)]="dto.email"
            placeholder="Enter Email"
            required
          />
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-box">
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="dto.password"
              placeholder="Enter Password"
              required
            />
            <button
              type="button"
              class="show-btn"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              (click)="showPassword = !showPassword"
            >
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="login-btn" [disabled]="loading">
          <span *ngIf="!loading"> Login </span>
          <span *ngIf="loading"> Logging in... </span>
        </button>
        <div
          class="auth-links mt-3 d-flex justify-content-between"
          style="display: flex; justify-content: space-between; margin-top: 15px; font-size: 14px"
        >
          <a routerLink="/forgot-password" style="color: var(--color-accent); text-decoration: none"
            >Forgot Password?</a
          >
          <a
            routerLink="/register"
            style="color: var(--color-accent); text-decoration: none; font-weight: 600"
            >Sign Up</a
          >
        </div>
      </form>
    </div>
  </div>
</div>
