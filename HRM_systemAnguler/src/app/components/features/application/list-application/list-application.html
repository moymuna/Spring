<div class="container">
  <div class="header">
    <h2>Application List</h2>
    <div class="header-actions">
      <div class="search-box">
        <input
          type="text"
          placeholder="Search by applicant or job title..."
          [(ngModel)]="keyword"
          (keyup.enter)="search()"
        />
        <button (click)="search()">Search</button>
      </div>
      <a routerLink="/application/add" class="add-btn"> + Add Application </a>
    </div>
  </div>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Applicant</th>
        <th>Job</th>
        <th>Date</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of applications">
        <td>{{ a.id }}</td>
        <td>{{ a.applicantName }}</td>
        <td>{{ a.jobTitle }}</td>
        <td>{{ a.applyDate }}</td>
        <td>{{ a.status }}</td>
        <td>
          <a [routerLink]="['/application/edit', a.id]" class="edit-btn"> Edit </a>
          <a
            [routerLink]="['/application/hire', a.id]"
            class="hire-btn"
            *ngIf="a.status !== 'HIRED' && a.status !== 'REJECTED'"
          >
            Hire
          </a>
          <button (click)="delete(a.id!)" class="delete-btn">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="pagination" *ngIf="totalPages > 1">
    <button (click)="changePage(page - 1)" [disabled]="page === 0">Prev</button>
    <button *ngFor="let p of getPages()" (click)="changePage(p)" [class.active]="page === p">
      {{ p + 1 }}
    </button>
    <button (click)="changePage(page + 1)" [disabled]="page >= totalPages - 1">Next</button>
  </div>
</div>

<app-modal-outlet (closed)="load()"></app-modal-outlet>
