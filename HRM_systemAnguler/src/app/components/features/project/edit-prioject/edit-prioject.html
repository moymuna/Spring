<div class="project-container">
  <h2>Edit Project</h2>
  <div class="success" *ngIf="successMessage">
    {{ successMessage }}
  </div>
  <div class="error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>
  <form [formGroup]="projectForm" (ngSubmit)="updateProject()">
    <div class="form-group">
      <label> Project Name </label>
      <input type="text" formControlName="projectName" placeholder="Enter Project Name" />
    </div>
    <div class="form-group">
      <label> Description </label>
      <textarea formControlName="description" placeholder="Enter Description"></textarea>
    </div>
    <div class="form-group">
      <label> Start Date </label>
      <input type="date" formControlName="startDate" placeholder="Enter Start Date" />
    </div>
    <div class="form-group">
      <label> End Date </label>
      <input type="date" formControlName="endDate" placeholder="Enter End Date" />
    </div>
    <div class="form-group">
      <label> Employees </label>
      <select multiple formControlName="employeeId">
        <option *ngFor="let emp of employees" [value]="emp.id">
          {{ emp.employeeName || emp.fullName }}
        </option>
      </select>
    </div>
    <div class="form-group">
      <label> Office </label>
      <select formControlName="officeId">
        <option value="">Select Office</option>
        <option *ngFor="let office of offices" [value]="office.id">
          {{ office.officeName }}
        </option>
      </select>
    </div>
    <div class="buttons">
      <button type="submit">Update</button>
      <button type="button" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
