<div class="container">
  <h2>Apply Leave</h2>
  <div class="success" *ngIf="successMessage">
    {{ successMessage }}
  </div>
  <div class="error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>
  <form [formGroup]="leaveForm" (ngSubmit)="saveLeave()">
    <div class="form-group" *ngIf="!isEmployeeOnly">
      <label>Employee</label>
      <select formControlName="employeeId">
        <option value="">Select Employee</option>
        <option *ngFor="let emp of employees" [value]="emp.id">
          {{ emp.fullName }}
        </option>
      </select>
    </div>
    <div class="form-group" *ngIf="isEmployeeOnly">
      <label>Employee</label>
      <input type="text" [value]="selfEmployeeName" disabled />
    </div>
    <div class="form-group">
      <label>Leave Type</label>
      <select formControlName="leaveTypeId">
        <option value="">Select Leave Type</option>
        <option *ngFor="let type of leaveTypes" [value]="type.id">
          {{ type.name }}
        </option>
      </select>
    </div>
    <div class="form-group">
      <label>Start Date</label>
      <input type="date" formControlName="startDate" placeholder="Enter Start Date" />
    </div>
    <div class="form-group">
      <label>End Date</label>
      <input type="date" formControlName="endDate" placeholder="Enter End Date" />
    </div>
    <div class="form-group">
      <label>Total Days</label>
      <input type="number" formControlName="totalDays" placeholder="Enter Total Days" />
    </div>
    <div class="form-group">
      <label>Reason</label>
      <textarea rows="5" formControlName="reason" placeholder="Enter Reason"></textarea>
    </div>
    <button type="submit">Apply Leave</button>
  </form>
</div>
