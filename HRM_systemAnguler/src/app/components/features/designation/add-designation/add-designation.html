<div class="container">
  <h2>Add Designation</h2>
  <form (ngSubmit)="save()">
    <div class="form-group">
      <label> Designation Title </label>
      <input
        type="text"
        name="title"
        [(ngModel)]="designation.title"
        placeholder="Enter Designation Title"
        required
      />
    </div>
    <div class="form-group">
      <label> Level </label>
      <input type="text" name="level" [(ngModel)]="designation.level" placeholder="Enter Level" />
    </div>
    <div class="form-group">
      <label> Department </label>
      <select name="departmentId" [(ngModel)]="designation.departmentId" required>
        <option [value]="0">Select Department</option>
        <option *ngFor="let d of departments" [value]="d.id">
          {{ d.departmentName }}
        </option>
      </select>
    </div>
    <div class="button-group">
      <button type="submit" class="btn-save">Save</button>
      <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
