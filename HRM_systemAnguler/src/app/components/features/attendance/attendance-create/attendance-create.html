<div class="attendance-container">
  <h2>Add Attendance</h2>
  <form (ngSubmit)="saveAttendance()">
    <div class="form-grid">
      <div class="form-group">
        <label>Date <span class="required-mark">*</span></label>
        <input
          type="date"
          name="date"
          [(ngModel)]="attendance.date"
          placeholder="Enter Date"
          required
        />
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status" [(ngModel)]="attendance.status">
          <option value="">Select Status</option>
          <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Check In</label>
        <input
          type="datetime-local"
          name="checkInTime"
          [(ngModel)]="attendance.checkInTime"
          placeholder="Enter Check In"
        />
      </div>
      <div class="form-group">
        <label>Check Out</label>
        <input
          type="datetime-local"
          name="checkOutTime"
          [(ngModel)]="attendance.checkOutTime"
          placeholder="Enter Check Out"
        />
      </div>
      <div class="form-group form-group-full">
        <label>Employee <span class="required-mark">*</span></label>
        <select name="employeeId" [(ngModel)]="attendance.employeeId">
          <option [value]="0">Select Employee</option>
          <option *ngFor="let e of employees" [value]="e.id">
            {{ e.fullName }} ({{ e.employeeCode }})
          </option>
        </select>
      </div>
    </div>
    <div class="button-area">
      <button type="submit" class="save-btn">Save</button>
      <button type="button" (click)="cancel()" class="cancel-btn">Cancel</button>
    </div>
  </form>
</div>
