<div class="attendance-container" *ngIf="attendance">
  <h2>Edit Attendance</h2>
  <form (ngSubmit)="updateAttendance()">
    <div class="form-grid">
      <div class="form-group">
        <label>Date</label>
        <input type="date" [(ngModel)]="attendance.date" name="date" placeholder="Enter Date" />
      </div>
      <div class="form-group">
        <label>Status</label>
        <select [(ngModel)]="attendance.status" name="status">
          <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Check In</label>
        <input
          type="datetime-local"
          [(ngModel)]="attendance.checkInTime"
          name="checkInTime"
          placeholder="Enter Check In"
        />
      </div>
      <div class="form-group">
        <label>Check Out</label>
        <input
          type="datetime-local"
          [(ngModel)]="attendance.checkOutTime"
          name="checkOutTime"
          placeholder="Enter Check Out"
        />
      </div>
      <div class="form-group form-group-full">
        <label>Employee</label>
        <select [(ngModel)]="attendance.employeeId" name="employeeId">
          <option *ngFor="let e of employees" [value]="e.id">
            {{ e.fullName }} ({{ e.employeeCode }})
          </option>
        </select>
      </div>
    </div>
    <div class="button-area">
      <button type="submit" class="save-btn">Update</button>
      <button type="button" (click)="cancel()" class="cancel-btn">Cancel</button>
    </div>
  </form>
</div>
