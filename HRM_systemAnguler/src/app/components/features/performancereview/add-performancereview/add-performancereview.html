<div class="performance-container">
  <h2>Add Performance Review</h2>
  <div class="success" *ngIf="successMessage">
    {{ successMessage }}
  </div>
  <div class="error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>
  <form [formGroup]="performanceReviewForm" (ngSubmit)="savePerformanceReview()">
    <div class="form-row">
      <div class="form-group">
        <label> Employee ID </label>
        <input type="number" formControlName="employeeId" placeholder="Enter Employee ID" />
      </div>
      <div class="form-group">
        <label> Reviewer </label>
        <input type="text" [value]="reviewerName" disabled />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label> Review Start Date </label>
        <input type="date" formControlName="reviewPeriodStart" />
      </div>
      <div class="form-group">
        <label> Review End Date </label>
        <input type="date" formControlName="reviewPeriodEnd" />
      </div>
    </div>
    <div class="form-group">
      <label> Rating (0 - 5) </label>
      <input type="number" step="0.1" formControlName="rating" placeholder="Enter Rating (0 - 5)" />
    </div>
    <div class="form-group">
      <label> Strengths </label>
      <textarea rows="4" formControlName="strengths" placeholder="Enter Strengths"></textarea>
    </div>
    <div class="form-group">
      <label> Areas For Improvement </label>
      <textarea
        rows="4"
        formControlName="areasForImprovement"
        placeholder="Enter Areas For Improvement"
      ></textarea>
    </div>
    <div class="form-group">
      <label> Comments </label>
      <textarea rows="4" formControlName="comments" placeholder="Enter Comments"></textarea>
    </div>
    <div class="form-group">
      <label> Status </label>
      <select formControlName="status">
        <option *ngFor="let status of statuses" [value]="status">
          {{ status }}
        </option>
      </select>
    </div>
    <button type="submit" class="save-btn">Save Review</button>
  </form>
</div>
