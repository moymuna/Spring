<div class="department-container">
  <div class="header">
    <h2>Department List</h2>
    <div class="header-actions">
      <div class="search-box">
        <input
          type="text"
          placeholder="Search by name or code..."
          [(ngModel)]="keyword"
          (keyup.enter)="search()"
        />
        <button (click)="search()">Search</button>
      </div>
      <button routerLink="/department/add">Add Department</button>
    </div>
  </div>
  <table>
    <thead>
      <tr>
        <th>SL</th>
        <th>Name</th>
        <th>Code</th>
        <th>Office</th>
        <th>Department Head</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let department of departments; let i = index">
        <td>
          {{ i + 1 }}
        </td>
        <td>
          {{ department.departmentName }}
        </td>
        <td>
          {{ department.code }}
        </td>
        <td>
          {{ department.officeName }}
        </td>
        <td>
          {{ department.departmentHeadName || 'Not Assigned' }}
        </td>
        <td>
          <button class="view-btn" (click)="details(department.id!)">View</button>
          <button class="edit-btn" (click)="edit(department.id!)">Edit</button>
          <button class="delete-btn" (click)="delete(department.id!)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="empty" *ngIf="departments.length === 0">No Department Found</div>
  <div class="pagination" *ngIf="totalPages > 1">
    <button (click)="changePage(page - 1)" [disabled]="page === 0">Prev</button>
    <button *ngFor="let p of getPages()" (click)="changePage(p)" [class.active]="page === p">
      {{ p + 1 }}
    </button>
    <button (click)="changePage(page + 1)" [disabled]="page >= totalPages - 1">Next</button>
  </div>
</div>

<app-modal-outlet (closed)="loadDepartments()"></app-modal-outlet>
