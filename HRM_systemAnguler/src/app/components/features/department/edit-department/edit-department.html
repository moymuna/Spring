<div class="department-container">
  <h2>Edit Department</h2>
  <form (ngSubmit)="update()">
    <div class="form-group">
      <label> Department Name </label>
      <input
        type="text"
        name="departmentName"
        [(ngModel)]="department.departmentName"
        placeholder="Enter Department Name"
      />
    </div>
    <div class="form-group">
      <label> Department Code </label>
      <input
        type="text"
        name="code"
        [(ngModel)]="department.code"
        placeholder="Enter Department Code"
      />
    </div>
    <div class="form-group">
      <label> Office </label>
      <select name="officeId" [(ngModel)]="department.officeId">
        <option value="0">Select Office</option>
        <option *ngFor="let office of offices" [value]="office.id">
          {{ office.officeName }}
        </option>
      </select>
    </div>
    <div class="form-group">
      <label> Department Head (Optional) </label>
      <select name="departmentHeadId" [(ngModel)]="department.departmentHeadId">
        <option [ngValue]="undefined">No Department Head</option>
        <option *ngFor="let emp of employees" [value]="emp.id">
          {{ emp.fullName }}
        </option>
      </select>
    </div>
    <div class="button-area">
      <button type="submit" class="update-btn">Update</button>
      <button type="button" class="cancel-btn" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
