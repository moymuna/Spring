<div class="office-container">
  <h2>Edit Office</h2>
  <form [formGroup]="officeForm" (ngSubmit)="updateOffice()">
    <div class="section">
      <h3>Office Information</h3>
      <div class="form-group">
        <label>Office Name</label>
        <input type="text" formControlName="officeName" placeholder="Enter Office Name" />
      </div>
      <div class="form-group">
        <label>Office Code</label>
        <input type="text" formControlName="officeCode" placeholder="Enter Office Code" />
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" formControlName="phone" placeholder="Enter Phone" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="Enter Email" />
      </div>
    </div>
    <div class="section">
      <h3>Address Information</h3>
      <div class="form-group">
        <label>Address Line 1</label>
        <input type="text" formControlName="addressLine1" placeholder="Enter Address Line 1" />
      </div>
      <div class="form-group">
        <label>Address Line 2</label>
        <input type="text" formControlName="addressLine2" placeholder="Enter Address Line 2" />
      </div>
      <div class="form-group">
        <label>Post Office</label>
        <input type="text" formControlName="postOffice" placeholder="Enter Post Office" />
      </div>
      <div class="form-group">
        <label>Postal Code</label>
        <input type="text" formControlName="postalCode" placeholder="Enter Postal Code" />
      </div>
      <div class="row">
        <div class="form-group">
          <label>Country</label>
          <select formControlName="countryId" (change)="onCountryChange()">
            <option [ngValue]="null">Select Country</option>
            <option *ngFor="let country of countries" [ngValue]="country.id">
              {{ country.countryName }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label>Division</label>
          <select formControlName="divisionId" (change)="onDivisionChange()">
            <option [ngValue]="null">Select Division</option>
            <option *ngFor="let division of divisions" [ngValue]="division.id">
              {{ division.name }}
            </option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>District</label>
          <select formControlName="districtId" (change)="onDistrictChange()">
            <option [ngValue]="null">Select District</option>
            <option *ngFor="let district of districts" [ngValue]="district.id">
              {{ district.districtsName }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label>Police Station</label>
          <select formControlName="policeStationId">
            <option [ngValue]="null">Select Police Station</option>
            <option *ngFor="let ps of policeStations" [ngValue]="ps.id">
              {{ ps.name }}
            </option>
          </select>
        </div>
      </div>
    </div>
    <button type="submit" class="save-btn">Update Office</button>
  </form>
</div>
