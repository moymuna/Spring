<div class="office-container">
  <h2>Add Office</h2>
  <form (ngSubmit)="save()">
    <div class="form-group">
      <label>Office Name</label>
      <input
        type="text"
        [(ngModel)]="office.officeName"
        name="officeName"
        placeholder="Enter Office Name"
        required
      />
    </div>
    <div class="form-group">
      <label>Office Code</label>
      <input
        type="text"
        [(ngModel)]="office.officeCode"
        name="officeCode"
        placeholder="Enter Office Code"
        required
      />
    </div>
    <div class="form-group">
      <label>Phone</label>
      <input type="text" [(ngModel)]="office.phone" name="phone" placeholder="Enter Phone" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="office.email" name="email" placeholder="Enter Email" />
    </div>
    <hr />
    <h3>Office Address</h3>
    <div class="form-group">
      <label>Address Line 1</label>
      <input
        type="text"
        [(ngModel)]="office.address.addressLine1"
        name="addressLine1"
        placeholder="Enter Address Line 1"
      />
    </div>
    <div class="form-group">
      <label>Address Line 2</label>
      <input
        type="text"
        [(ngModel)]="office.address.addressLine2"
        name="addressLine2"
        placeholder="Enter Address Line 2"
      />
    </div>
    <div class="form-group">
      <label>Post Office</label>
      <input
        type="text"
        [(ngModel)]="office.address.postOffice"
        name="postOffice"
        placeholder="Enter Post Office"
      />
    </div>
    <div class="form-group">
      <label>Postal Code</label>
      <input
        type="text"
        [(ngModel)]="office.address.postalCode"
        name="postalCode"
        placeholder="Enter Postal Code"
      />
    </div>
    <div class="form-group">
      <label>Country</label>
      <select [(ngModel)]="office.address.countryId" name="countryId" (change)="onCountryChange()">
        <option [value]="0">Select Country</option>
        <option *ngFor="let country of countries" [value]="country.id">
          {{ country.countryName }}
        </option>
      </select>
    </div>
    <div class="form-group">
      <label>Division</label>
      <select
        [(ngModel)]="office.address.divisionId"
        name="divisionId"
        (change)="onDivisionChange()"
      >
        <option [value]="0">Select Division</option>
        <option *ngFor="let division of divisions" [value]="division.id">
          {{ division.name }}
        </option>
      </select>
    </div>
    <div class="form-group">
      <label>District</label>
      <select
        [(ngModel)]="office.address.districtId"
        name="districtId"
        (change)="onDistrictChange()"
      >
        <option [value]="0">Select District</option>
        <option *ngFor="let district of districts" [value]="district.id">
          {{ district.districtsName }}
        </option>
      </select>
    </div>
    <div class="form-group">
      <label>Police Station</label>
      <select [(ngModel)]="office.address.policeStationId" name="policeStationId">
        <option [value]="0">Select Police Station</option>
        <option *ngFor="let ps of policeStations" [value]="ps.id">
          {{ ps.name }}
        </option>
      </select>
    </div>
    <button type="submit" class="save-btn">Save Office</button>
  </form>
</div>
