<div class="list-container">
  <div class="header">
    <h2>Office List</h2>
    <div class="header-actions">
      <div class="search-box">
        <input
          type="text"
          placeholder="Search by name or code..."
          [(ngModel)]="keyword"
          (keyup.enter)="search()"
        />
        <button (click)="search()">Search</button>
      </div>
      <a routerLink="/office/add" class="add-btn"> + Add Office </a>
    </div>
  </div>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Office Name</th>
        <th>Code</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Address</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let office of offices">
        <td>
          {{ office.id }}
        </td>
        <td>
          {{ office.officeName }}
        </td>
        <td>
          {{ office.officeCode }}
        </td>
        <td>
          {{ office.phone }}
        </td>
        <td>
          {{ office.email }}
        </td>
        <td>
          {{ office.address.addressLine1 }}
        </td>
        <td>
          <a [routerLink]="['/office/edit', office.id]" class="edit-btn"> Edit </a>
          <button (click)="deleteOffice(office.id)" class="delete-btn">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="pagination" *ngIf="totalPages > 1">
    <button (click)="changePage(page - 1)" [disabled]="page === 0">Prev</button>
    <button *ngFor="let p of getPages()" (click)="changePage(p)" [class.active]="page === p">
      {{ p + 1 }}
    </button>
    <button (click)="changePage(page + 1)" [disabled]="page >= totalPages - 1">Next</button>
  </div>
</div>

<app-modal-outlet [wide]="true" (closed)="loadOffice()"></app-modal-outlet>
