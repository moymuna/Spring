<div class="container-fluid mt-4">
  <div class="card shadow">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0">Edit User</h4>
      <button type="button" class="btn btn-light btn-sm" (click)="goBack()">Back</button>
    </div>
    <div class="card-body">
      <div *ngIf="loading" class="text-center mb-3">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2">Loading...</p>
      </div>
      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
      </div>
      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>
      <form [formGroup]="userForm" (ngSubmit)="updateUser()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label"> Full Name </label>
            <input
              type="text"
              class="form-control"
              formControlName="fullName"
              placeholder="Enter your Name"
            />
            <div class="text-danger" *ngIf="f.fullName.touched && f.fullName.invalid">
              <small *ngIf="f.fullName.errors?.['required']"> Full name is required. </small>
              <small *ngIf="f.fullName.errors?.['minlength']">
                Minimum 3 characters required.
              </small>
            </div>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label"> Email </label>
            <input
              type="email"
              class="form-control"
              formControlName="email"
              placeholder="Enter Email"
            />
            <div class="text-danger" *ngIf="f.email.touched && f.email.invalid">
              <small *ngIf="f.email.errors?.['required']"> Email is required. </small>
              <small *ngIf="f.email.errors?.['email']"> Enter valid email. </small>
            </div>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label"> Role </label>
            <select class="form-select" formControlName="role">
              <option *ngFor="let role of roles" [value]="role">
                {{ role }}
              </option>
            </select>
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label d-block"> Account Status </label>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" formControlName="enabled" />
              <label class="form-check-label"> Active </label>
            </div>
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label d-block"> Security </label>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" formControlName="accountLocked" />
              <label class="form-check-label"> Locked </label>
            </div>
          </div>
        </div>
        <div class="mt-4">
          <button type="submit" class="btn btn-primary me-2" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"> </span>
            Update User
          </button>
          <button type="button" class="btn btn-secondary" (click)="goBack()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
