<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header">
      <h3>Add New User</h3>
    </div>
    <div class="card-body">
      <form [formGroup]="userForm" (ngSubmit)="saveUser()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label"> Full Name </label>
            <input
              type="text"
              class="form-control"
              formControlName="fullName"
              placeholder="Enter Full Name"
            />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label"> Email </label>
            <input
              type="email"
              class="form-control"
              formControlName="email"
              placeholder="Enter Email"
            />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label"> Password </label>
            <input
              type="password"
              class="form-control"
              formControlName="password"
              placeholder="Enter Password"
            />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label"> Role </label>
            <select class="form-select" formControlName="role">
              <option *ngFor="let role of roles" [value]="role">
                {{ role }}
              </option>
            </select>
          </div>
          <div class="col-md-6">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" formControlName="enabled" />
              <label class="form-check-label"> Active </label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" formControlName="accountLocked" />
              <label class="form-check-label"> Account Locked </label>
            </div>
          </div>
        </div>
        <div class="alert alert-danger mt-3" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
        <div class="alert alert-success mt-3" *ngIf="successMessage">
          {{ successMessage }}
        </div>
        <div class="mt-4">
          <button class="btn btn-primary" type="submit" [disabled]="loading">Save</button>
          <button class="btn btn-secondary ms-2" type="button" (click)="resetForm()">Reset</button>
        </div>
      </form>
    </div>
  </div>
</div>
