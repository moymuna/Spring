<div class="container">
  <h2>Audit Log</h2>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Entity</th>
        <th>Action</th>
        <th>Actor</th>
        <th>Details</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of entries">
        <td>{{ e.timestamp | date: 'short' }}</td>
        <td>{{ e.entityType }} #{{ e.entityId }}</td>
        <td>{{ e.action }}</td>
        <td>{{ e.actorEmail }} ({{ e.actorRole }})</td>
        <td>{{ e.details }}</td>
      </tr>
    </tbody>
  </table>
  <div class="empty" *ngIf="entries.length === 0">No audit log entries found.</div>
  <div class="pagination" *ngIf="totalPages > 1">
    <button (click)="changePage(page - 1)" [disabled]="page === 0">Prev</button>
    <button *ngFor="let p of getPages()" (click)="changePage(p)" [class.active]="page === p">
      {{ p + 1 }}
    </button>
    <button (click)="changePage(page + 1)" [disabled]="page >= totalPages - 1">Next</button>
  </div>
</div>
