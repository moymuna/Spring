<div class="container">
  <h2>Add Leave Balance</h2>
  <div class="success" *ngIf="successMessage">
    {{ successMessage }}
  </div>
  <div class="error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>
  <form [formGroup]="leaveBalanceForm" (ngSubmit)="saveLeaveBalance()">
    <div class="form-group">
      <label> Employee </label>
      <select formControlName="employeeId">
        <option value="">Select Employee</option>
        <option *ngFor="let emp of employees" [value]="emp.id">
          {{ emp.fullName }}
        </option>
      </select>
    </div>
    <div class="form-group">
      <label> Leave Type </label>
      <select formControlName="leaveTypeId">
        <option value="">Select Leave Type</option>
        <option *ngFor="let type of leaveTypes" [value]="type.id">
          {{ type.name }}
        </option>
      </select>
    </div>
    <div class="form-group">
      <label> Year </label>
      <input type="number" formControlName="year" placeholder="Enter Year" />
    </div>
    <div class="form-group">
      <label> Total Entitled Days </label>
      <input
        type="number"
        formControlName="totalEntitled"
        placeholder="Enter Total Entitled Days"
      />
    </div>
    <div class="form-group">
      <label> Used Days </label>
      <input type="number" formControlName="used" placeholder="Enter Used Days" />
    </div>
    <button type="submit">Save Leave Balance</button>
  </form>
</div>
