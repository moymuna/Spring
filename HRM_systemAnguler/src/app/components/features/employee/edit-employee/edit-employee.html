<div class="employee-container">
  <h2>Edit Employee</h2>
  <div class="success-message" *ngIf="successMessage">
    {{ successMessage }}
  </div>
  <div class="error-message" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>
  <form *ngIf="employeeForm" [formGroup]="employeeForm" (ngSubmit)="updateEmployee()">
    <div class="section">
      <h3>Employee Information</h3>
      <div class="form-grid">
        <div class="form-group">
          <label> Contract No </label>
          <input
            type="text"
            class="form-control"
            formControlName="contractNo"
            placeholder="Enter Contract No"
          />
        </div>
        <div class="form-group">
          <label> Employee Code </label>
          <input
            type="text"
            class="form-control"
            formControlName="employeeCode"
            placeholder="Enter Employee Code"
          />
        </div>
        <div class="form-group">
          <label> Joining Date </label>
          <input
            type="date"
            class="form-control"
            formControlName="joiningDate"
            placeholder="Enter Joining Date"
          />
        </div>
        <div class="form-group">
          <label> Date Of Birth </label>
          <input
            type="date"
            class="form-control"
            formControlName="dateOfBirth"
            placeholder="Enter Date Of Birth"
          />
        </div>
        <div class="form-group">
          <label> Status </label>
          <select class="form-control" formControlName="status">
            <option *ngFor="let status of employeeStatuses" [value]="status">
              {{ status }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label> Gender </label>
          <select class="form-control" formControlName="gender">
            <option value="">Select Gender</option>
            <option *ngFor="let gender of genders" [value]="gender">
              {{ gender }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label> Blood Group </label>
          <input
            type="text"
            class="form-control"
            formControlName="bloodGroup"
            placeholder="Enter Blood Group"
          />
        </div>
        <div class="form-group">
          <label> Employment Type </label>
          <select class="form-control" formControlName="employmentType">
            <option *ngFor="let type of employmentTypes" [value]="type">
              {{ type }}
            </option>
          </select>
        </div>
      </div>
    </div>
    <div class="section">
      <h3>Bank Details (Salary Account)</h3>
      <div class="form-grid">
        <div class="form-group">
          <label> Bank Name </label>
          <input
            type="text"
            class="form-control"
            formControlName="bankName"
            placeholder="Enter Bank Name"
          />
        </div>
        <div class="form-group">
          <label> Branch </label>
          <input
            type="text"
            class="form-control"
            formControlName="bankBranch"
            placeholder="Enter Branch"
          />
        </div>
        <div class="form-group">
          <label> Account Holder Name </label>
          <input
            type="text"
            class="form-control"
            formControlName="bankAccountName"
            placeholder="Enter Account Holder Name"
          />
        </div>
        <div class="form-group">
          <label> Account Number </label>
          <input
            type="text"
            class="form-control"
            formControlName="bankAccountNumber"
            placeholder="Enter Account Number"
          />
        </div>
      </div>
    </div>
    <div class="section">
      <h3>User Information</h3>
      <div class="form-grid">
        <div class="form-group">
          <label> Full Name </label>
          <input
            type="text"
            class="form-control"
            formControlName="fullName"
            placeholder="Enter Full Name"
          />
        </div>
        <div class="form-group">
          <label> Email </label>
          <input
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="Enter Email"
          />
        </div>
        <div class="form-group">
          <label> Role </label>
          <select class="form-control" formControlName="role">
            <option *ngFor="let role of roles" [value]="role">
              {{ role }}
            </option>
          </select>
        </div>
      </div>
    </div>
    <div class="section">
      <h3>Organization Information</h3>
      <div class="form-grid">
        <div class="form-group">
          <label> Department </label>
          <select
            class="form-control"
            formControlName="departmentId"
            (change)="onDepartmentChange()"
          >
            <option value="">Select Department</option>
            <option *ngFor="let dept of departments" [value]="dept.id">
              {{ dept.departmentName }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label> Designation </label>
          <select class="form-control" formControlName="designationId">
            <option value="">Select Designation</option>
            <option *ngFor="let des of designations" [value]="des.id">
              {{ des.title }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label> Office </label>
          <select class="form-control" formControlName="officeId">
            <option value="">Select Office</option>
            <option *ngFor="let office of offices" [value]="office.id">
              {{ office.officeName }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label> Manager </label>
          <select class="form-control" formControlName="managerId">
            <option value="">No Manager</option>
            <option *ngFor="let manager of managers" [value]="manager.id">
              {{ manager.fullName }}
            </option>
          </select>
        </div>
      </div>
    </div>
    <div class="section" formGroupName="presentAddress">
      <h3>Present Address</h3>
      <div class="form-grid">
        <div class="form-group">
          <label> Address Line 1 </label>
          <input
            class="form-control"
            formControlName="addressLine1"
            placeholder="Enter Address Line 1"
          />
        </div>
        <div class="form-group">
          <label> Address Line 2 </label>
          <input
            class="form-control"
            formControlName="addressLine2"
            placeholder="Enter Address Line 2"
          />
        </div>
        <div class="form-group">
          <label> Post Office </label>
          <input
            class="form-control"
            formControlName="postOffice"
            placeholder="Enter Post Office"
          />
        </div>
        <div class="form-group">
          <label> Postal Code </label>
          <input
            class="form-control"
            formControlName="postalCode"
            placeholder="Enter Postal Code"
          />
        </div>
        <div class="form-group">
          <label> Country </label>
          <select
            class="form-control"
            formControlName="countryId"
            (change)="onCountryChange('presentAddress')"
          >
            <option value="">Select Country</option>
            <option *ngFor="let country of countries" [value]="country.id">
              {{ country.countryName }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label> Division </label>
          <select
            class="form-control"
            formControlName="divisionId"
            (change)="onDivisionChange('presentAddress')"
          >
            <option value="">Select Division</option>
            <option *ngFor="let division of presentDivisions" [value]="division.id">
              {{ division.name }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label> District </label>
          <select
            class="form-control"
            formControlName="districtId"
            (change)="onDistrictChange('presentAddress')"
          >
            <option value="">Select District</option>
            <option *ngFor="let district of presentDistricts" [value]="district.id">
              {{ district.districtsName }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label> Police Station </label>
          <select class="form-control" formControlName="policeStationId">
            <option value="">Select Police Station</option>
            <option *ngFor="let ps of presentPoliceStations" [value]="ps.id">
              {{ ps.name }}
            </option>
          </select>
        </div>
      </div>
    </div>
    <div class="section" formGroupName="permanentAddress">
      <h3>Permanent Address</h3>
      <label class="same-as-present">
        <input
          type="checkbox"
          [checked]="sameAsPresent"
          (change)="toggleSameAsPresent($event.target.checked)"
        />
        Same as Present Address
      </label>
      <div class="form-grid">
        <div class="form-group">
          <label> Address Line 1 </label>
          <input
            class="form-control"
            formControlName="addressLine1"
            [attr.disabled]="sameAsPresent || null"
            placeholder="Enter Address Line 1"
          />
        </div>
        <div class="form-group">
          <label> Address Line 2 </label>
          <input
            class="form-control"
            formControlName="addressLine2"
            [attr.disabled]="sameAsPresent || null"
            placeholder="Enter Address Line 2"
          />
        </div>
        <div class="form-group">
          <label> Post Office </label>
          <input
            class="form-control"
            formControlName="postOffice"
            [attr.disabled]="sameAsPresent || null"
            placeholder="Enter Post Office"
          />
        </div>
        <div class="form-group">
          <label> Postal Code </label>
          <input
            class="form-control"
            formControlName="postalCode"
            [attr.disabled]="sameAsPresent || null"
            placeholder="Enter Postal Code"
          />
        </div>
        <div class="form-group">
          <label> Country </label>
          <select
            class="form-control"
            formControlName="countryId"
            [attr.disabled]="sameAsPresent || null"
            (change)="onCountryChange('permanentAddress')"
          >
            <option value="">Select Country</option>
            <option *ngFor="let country of countries" [value]="country.id">
              {{ country.countryName }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label> Division </label>
          <select
            class="form-control"
            formControlName="divisionId"
            [attr.disabled]="sameAsPresent || null"
            (change)="onDivisionChange('permanentAddress')"
          >
            <option value="">Select Division</option>
            <option *ngFor="let division of permanentDivisions" [value]="division.id">
              {{ division.name }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label> District </label>
          <select
            class="form-control"
            formControlName="districtId"
            [attr.disabled]="sameAsPresent || null"
            (change)="onDistrictChange('permanentAddress')"
          >
            <option value="">Select District</option>
            <option *ngFor="let district of permanentDistricts" [value]="district.id">
              {{ district.districtsName }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label> Police Station </label>
          <select
            class="form-control"
            formControlName="policeStationId"
            [attr.disabled]="sameAsPresent || null"
          >
            <option value="">Select Police Station</option>
            <option *ngFor="let ps of permanentPoliceStations" [value]="ps.id">
              {{ ps.name }}
            </option>
          </select>
        </div>
      </div>
    </div>
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Employee Photo</h5>
      </div>
      <div class="card-body text-center">
        <img
          *ngIf="imagePreview"
          [src]="imagePreview"
          class="rounded-circle border shadow"
          width="170"
          height="170"
          style="object-fit: cover"
        />
        <div
          *ngIf="!imagePreview"
          class="border rounded-circle d-inline-flex justify-content-center align-items-center"
          style="width: 170px; height: 170px"
        >
          <i class="bi bi-person fs-1 text-secondary"></i>
        </div>
        <div class="mt-3">
          <input #fileInput type="file" hidden accept="image/*" (change)="onFileSelected($event)" />
          <button class="btn btn-primary me-2" type="button" (click)="fileInput.click()">
            <i class="bi bi-upload"></i>
            Choose Image
          </button>
          <button
            *ngIf="imagePreview"
            class="btn btn-outline-danger"
            type="button"
            (click)="removeSelectedFile(fileInput)"
          >
            Remove
          </button>
        </div>
      </div>
    </div>
    <div class="action">
      <button type="submit" class="btn-update" [disabled]="loading">
        <span *ngIf="!loading"> Update Employee </span>
        <span *ngIf="loading"> Updating... </span>
      </button>
      <button type="button" class="btn-cancel" routerLink="/employee">Cancel</button>
    </div>
  </form>
</div>
